[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-model-pipeline"
version = "0.1.0"
description = "ETL + EDA pipeline comparing AI models on performance vs size, cost and speed"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "numpy>=1.26",
    "pydantic>=2.6",
    "matplotlib>=3.8",
    "dotenv>=0.9.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aimodels = "aimodels.__main__:main"
aimodels-dashboard = "aimodels.dashboard:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimodels = ["web/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
